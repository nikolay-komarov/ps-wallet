<p>{{ title }}</p>

<app-input
  type="email"
  placeholder="Email"
  iconUrl="icons/mail.svg"
  [(value)]="email"
  (valueChange)="handleEmailInput($event)"
/>

<app-password-input
  placeholder="Пароль"
  iconUrl="icons/lock.svg"
  [(value)]="password"
  (valueChange)="handlePasswordInput($event)"
  (passwordVisibilityChange)="handlePasswordVisibilityChange($event)"
/>

<app-input
  type="text"
  placeholder="Заблокированное поле"
  [disabled]="true"
  [(value)]="blockedText"
/>

<p>Введённый email: {{ email() }}</p>
<p>Введённый пароль: {{ password() }}</p>

<app-button (clicked)="handleButtonClick()">Войти</app-button>
