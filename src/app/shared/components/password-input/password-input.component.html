<div class="form__input-wrapper">
  @if (iconUrl()) {
    <img class="form__input-icon" [src]="iconUrl()" alt="" aria-hidden="true" />
  }
  <input
    class="form__input form__input--with-icon"
    [class.form__input--with-toggle]="visibilityIconUrl"
    [type]="passwordVisible() ? 'text' : 'password'"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="handleInput($event)"
  />
  <button
    type="button"
    class="form__password-toggle"
    [disabled]="disabled()"
    (click)="togglePasswordVisibility()"
  >
    <img [src]="visibilityIconUrl" alt="Показать/скрыть пароль" />
  </button>
</div>
